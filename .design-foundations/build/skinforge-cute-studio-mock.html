<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkinForge Main Editor — Cute Studio direction mock</title>
  <!-- Throwaway tokens only — does NOT use DESIGN.md (old Ledger Pantry direction) -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* === THROWAWAY TOKENS — Cute Studio direction === */
    :root {
      /* Backgrounds */
      --bg-cream:       #FEFDF5;
      --bg-surface:     #FFFFFF;
      --bg-surface-alt: #FFF0F5;
      --bg-canvas:      #E8E8E8;
      --bg-viewer:      #2A2530;

      /* Accents */
      --coral:          #C8490D;
      --coral-tint:     #FFF0EC;
      --coral-hover:    #A83808;
      --lavender:       #9B8EC4;
      --lavender-tint:  #FFF0F5;
      --butter:         #FFD166;

      /* Text */
      --text-primary:   #3D3340;
      --text-secondary: #7A7085;
      --text-on-coral:  #FFFFFF;
      --text-on-lav:    #FFFFFF;

      /* Borders */
      --border:         #E8DFF0;

      /* Radius */
      --r-btn:    8px;
      --r-panel:  12px;
      --r-input:  6px;
      --r-tip:    8px;
      --r-swatch: 8px;

      /* Type */
      --font-display: 'Silkscreen', monospace;
      --font-body:    'Nunito', sans-serif;
    }

    /* === RESET === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-cream);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* === PREFERS-REDUCED-MOTION === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================
       TOP BAR
    ========================================= */
    header#top-bar {
      height: 36px;
      min-height: 36px;
      background: var(--bg-cream);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 16px;
      z-index: 10;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Pixel-art "S" logomark — 16×16 grid of coral squares */
    .logo-mark {
      width: 16px;
      height: 16px;
      position: relative;
      flex-shrink: 0;
      color: var(--coral);
    }

    .logo-mark svg {
      display: block;
    }

    .logo-title {
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--coral);
      letter-spacing: 0.02em;
      line-height: 1;
    }

    nav#top-menu {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
    }

    nav#top-menu button {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      background: transparent;
      border: none;
      padding: 4px 8px;
      border-radius: var(--r-btn);
      cursor: pointer;
      transition: background 150ms ease;
    }

    nav#top-menu button:hover {
      background: var(--lavender-tint);
    }

    /* =========================================
       OPTIONS BAR
    ========================================= */
    #options-bar {
      height: 32px;
      min-height: 32px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 14px;
    }

    .opts-label {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .opts-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .opts-btn {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms, color 120ms;
    }

    .opts-btn.active {
      background: var(--coral);
      border-color: var(--coral);
      color: var(--text-on-coral);
    }

    .opts-btn:hover:not(.active) {
      background: var(--lavender-tint);
      border-color: var(--lavender);
    }

    .opts-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    /* =========================================
       MAIN AREA
    ========================================= */
    #main-area {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }

    /* =========================================
       LEFT TOOLBAR
    ========================================= */
    aside#toolbar {
      width: 44px;
      min-width: 44px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
      gap: 4px;
    }

    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--r-btn);
      background: transparent;
      border: 1.5px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background 120ms, border-color 120ms, color 120ms;
    }

    .tool-btn:hover {
      background: var(--lavender-tint);
      color: var(--text-primary);
    }

    .tool-btn.active {
      background: var(--coral-tint);
      border-color: var(--coral);
      color: var(--coral);
    }

    .tool-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .tool-separator {
      width: 24px;
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    /* =========================================
       CENTER CANVAS
    ========================================= */
    #canvas-area {
      flex: 1;
      background-color: #D8D8D8;
      background-image:
        linear-gradient(45deg, #CACACA 25%, transparent 25%),
        linear-gradient(-45deg, #CACACA 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #CACACA 75%),
        linear-gradient(-45deg, transparent 75%, #CACACA 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #pixel-grid-wrap {
      position: relative;
    }

    #pixel-grid {
      display: block;
      image-rendering: pixelated;
      box-shadow:
        0 0 0 1px #999,
        0 4px 24px rgba(0,0,0,0.25);
    }

    /* =========================================
       RIGHT PANEL
    ========================================= */
    aside#right-panel {
      width: 240px;
      min-width: 240px;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(155, 142, 196, 0.18);
      border-radius: var(--r-panel) 0 0 var(--r-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 3D Viewer */
    #viewer-3d {
      height: 180px;
      min-height: 180px;
      background: var(--bg-viewer);
      border-radius: var(--r-panel) 0 0 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewer-label {
      position: absolute;
      top: 8px;
      left: 10px;
      font-family: var(--font-display);
      font-size: 9px;
      color: var(--lavender);
      letter-spacing: 0.05em;
    }

    /* Blocky Minecraft character */
    #mc-figure {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 10px;
    }

    .mc-head {
      width: 40px;
      height: 40px;
      background: #F5CBA7;
      border-radius: 2px;
    }

    .mc-body-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 0;
    }

    .mc-arm {
      width: 12px;
      height: 32px;
      background: #5B9BD5;
      border-radius: 2px;
    }

    .mc-torso {
      width: 24px;
      height: 40px;
      background: #5B9BD5;
      border-radius: 2px;
    }

    .mc-legs-row {
      display: flex;
      flex-direction: row;
      gap: 2px;
    }

    .mc-leg {
      width: 12px;
      height: 32px;
      background: #7B5EA7;
      border-radius: 2px;
    }

    /* Color Panel */
    #color-panel {
      flex: 1;
      padding: 12px;
      background: var(--bg-cream);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .panel-section-label {
      font-family: var(--font-display);
      font-size: 9px;
      color: var(--text-primary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-swatch {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: var(--r-panel);
      background: var(--coral);
      box-shadow: 0 0 0 2px white, 0 0 0 3.5px var(--coral);
      cursor: pointer;
    }

    .hex-input {
      flex: 1;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--r-input);
      padding: 6px 10px;
      outline: none;
      transition: border-color 120ms;
    }

    .hex-input:focus {
      border-color: var(--lavender);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 20px);
      gap: 3px;
    }

    .swatch {
      width: 20px;
      height: 20px;
      border-radius: var(--r-swatch);
      cursor: pointer;
      transition: transform 100ms, box-shadow 100ms;
    }

    .swatch:hover {
      transform: scale(1.2);
      z-index: 1;
    }

    .swatch.active {
      box-shadow: 0 0 0 2px white, 0 0 0 3.5px var(--coral);
    }

    /* =========================================
       BOTTOM BAR
    ========================================= */
    footer#bottom-bar {
      height: 30px;
      min-height: 30px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .bottom-label {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .pill-toggle {
      display: flex;
      background: var(--bg-surface);
      border-radius: 20px;
      padding: 2px;
      gap: 1px;
    }

    .pill-btn {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }

    .pill-btn.active {
      background: var(--lavender-tint);
      color: var(--text-primary);
      box-shadow: inset 0 0 0 1.5px var(--lavender);
    }

    .guide-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .guide-track {
      width: 28px;
      height: 14px;
      background: var(--bg-surface);
      border: 1.5px solid #8C7EB5;
      border-radius: var(--r-btn);
      position: relative;
      cursor: pointer;
      transition: background 200ms, border-color 200ms;
    }

    .guide-track.on {
      background: #8C7EB5;
      border-color: #8C7EB5;
    }

    .guide-knob {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 10px;
      height: 10px;
      background: var(--bg-cream);
      border-radius: 50%;
      transition: left 150ms;
    }

    .guide-track.on .guide-knob {
      left: 16px;
    }

    .bottom-divider {
      width: 1px;
      height: 16px;
      background: var(--border);
    }

    .undo-redo {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-cream);
      border: 1px solid var(--border);
      border-radius: var(--r-btn);
      padding: 2px 8px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }

    .icon-btn:hover {
      background: var(--lavender-tint);
      border-color: var(--lavender);
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <!-- ========== TOP BAR ========== -->
  <header id="top-bar">
    <div class="logo-group">
      <!-- Pixel-art "S" logomark: 4×4 grid of coral squares with gaps -->
      <div class="logo-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Row 1: cols 1-3 -->
          <rect x="1" y="1" width="4" height="4" fill="currentColor"/>
          <rect x="6" y="1" width="4" height="4" fill="currentColor"/>
          <rect x="11" y="1" width="4" height="4" fill="currentColor"/>
          <!-- Row 2: col 1 only (S curve left) -->
          <rect x="1" y="6" width="4" height="4" fill="currentColor"/>
          <!-- Row 3: cols 1-3 (middle bar of S) -->
          <rect x="1" y="11" width="4" height="4" fill="currentColor"/>
          <rect x="6" y="6"  width="4" height="4" fill="currentColor"/>
          <rect x="11" y="6" width="4" height="4" fill="currentColor"/>
          <!-- Row 4: col 3 only (S curve right, lower) — we need a different approach -->
          <!-- Actually let's do a cleaner pixel S -->
        </svg>
      </div>
      <!-- Cleaner pixel S using inline SVG -->
      <div class="logo-mark" aria-hidden="true" style="margin-left:-16px">
        <svg width="16" height="16" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="0" width="6" height="1" fill="currentColor"/>
          <rect x="0" y="1" width="1" height="2" fill="currentColor"/>
          <rect x="1" y="3" width="6" height="1" fill="currentColor"/>
          <rect x="6" y="4" width="1" height="2" fill="currentColor"/>
          <rect x="0" y="6" width="7" height="1" fill="currentColor"/>
        </svg>
      </div>
      <span class="logo-title">SkinForge</span>
    </div>

    <nav id="top-menu" aria-label="Application menu">
      <button type="button">File</button>
      <button type="button">Color</button>
    </nav>
  </header>

  <!-- ========== OPTIONS BAR ========== -->
  <div id="options-bar" role="toolbar" aria-label="Tool options">
    <span class="opts-label">Brush Size:</span>
    <div class="opts-group" role="group" aria-label="Brush size">
      <button class="opts-btn active" type="button" aria-pressed="true">1</button>
      <button class="opts-btn" type="button" aria-pressed="false">2</button>
      <button class="opts-btn" type="button" aria-pressed="false">4</button>
      <button class="opts-btn" type="button" aria-pressed="false">8</button>
    </div>
    <div class="opts-divider" aria-hidden="true"></div>
    <span class="opts-label">Shape:</span>
    <div class="opts-group" role="group" aria-label="Brush shape">
      <button class="opts-btn active" type="button" aria-pressed="true">Square</button>
      <button class="opts-btn" type="button" aria-pressed="false">Circle</button>
    </div>
  </div>

  <!-- ========== MAIN AREA ========== -->
  <div id="main-area">

    <!-- LEFT TOOLBAR -->
    <aside id="toolbar" aria-label="Drawing tools">

      <!-- Pen (active) -->
      <button class="tool-btn active" type="button" title="Pen (P)" aria-pressed="true" aria-label="Pen tool">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="14" y1="4" x2="6" y2="14"/>
          <rect x="4.5" y="12.5" width="3" height="3" rx="0.5"/>
          <line x1="14" y1="4" x2="12" y2="2"/>
          <line x1="12" y1="2" x2="16" y2="5"/>
        </svg>
      </button>

      <!-- Eraser -->
      <button class="tool-btn" type="button" title="Eraser (E)" aria-pressed="false" aria-label="Eraser tool">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="12" height="7" rx="2"/>
        </svg>
      </button>

      <div class="tool-separator" aria-hidden="true"></div>

      <!-- Fill -->
      <button class="tool-btn" type="button" title="Fill (F)" aria-pressed="false" aria-label="Fill bucket tool">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14 L4 6 L10 3 L13 7 L7 10 Z"/>
          <circle cx="14.5" cy="13.5" r="2" stroke-width="2"/>
        </svg>
      </button>

      <!-- Eyedropper -->
      <button class="tool-btn" type="button" title="Eyedropper (I)" aria-pressed="false" aria-label="Eyedropper tool">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="2" width="4" height="10" rx="2"/>
          <line x1="9" y1="12" x2="9" y2="16"/>
          <circle cx="9" cy="16" r="1.5" stroke-width="2"/>
        </svg>
      </button>

      <div class="tool-separator" aria-hidden="true"></div>

      <!-- Rect Select -->
      <button class="tool-btn" type="button" title="Rectangle Select (M)" aria-pressed="false" aria-label="Rectangle select tool">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="12" height="12" rx="2" stroke-dasharray="3 2"/>
        </svg>
      </button>

      <!-- Magic Wand -->
      <button class="tool-btn" type="button" title="Magic Wand (W)" aria-pressed="false" aria-label="Magic wand tool">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="9" y1="2" x2="9" y2="5"/>
          <line x1="9" y1="13" x2="9" y2="16"/>
          <line x1="2" y1="9" x2="5" y2="9"/>
          <line x1="13" y1="9" x2="16" y2="9"/>
          <line x1="4" y1="4" x2="6.5" y2="6.5"/>
          <line x1="11.5" y1="11.5" x2="14" y2="14"/>
          <line x1="14" y1="4" x2="11.5" y2="6.5"/>
          <line x1="6.5" y1="11.5" x2="4" y2="14"/>
          <circle cx="9" cy="9" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </button>

    </aside>

    <!-- CENTER CANVAS -->
    <main id="canvas-area" aria-label="Pixel editing canvas">
      <div id="pixel-grid-wrap">
        <!-- 64×64 pixel grid at 5px per cell = 320×320px -->
        <!-- Drawn as an inline SVG so we can show skin silhouette hint -->
        <svg id="pixel-grid"
             width="320" height="320"
             viewBox="0 0 320 320"
             xmlns="http://www.w3.org/2000/svg"
             aria-label="64×64 skin canvas">

          <!-- Base transparent fill (shows checkerboard through SVG transparency) -->
          <rect width="320" height="320" fill="#F5CBA7" fill-opacity="0.08"/>

          <!-- Skin silhouette hint — rough Minecraft skin UV layout -->
          <!-- Head (top-center area, around pixel 24,0 to 48,16 in 64-grid → 120,0 to 240,80) -->
          <rect x="120" y="8"   width="80" height="64" fill="#F5CBA7" fill-opacity="0.75"/>

          <!-- Body (pixel 20,20 to 44,32 → 100,100 to 220,160) -->
          <rect x="100" y="100" width="120" height="80" fill="#5B9BD5" fill-opacity="0.7"/>

          <!-- Left arm (pixel 40,20 to 48,32) -->
          <rect x="58"  y="100" width="40"  height="72" fill="#5B9BD5" fill-opacity="0.6"/>

          <!-- Right arm -->
          <rect x="222" y="100" width="40"  height="72" fill="#5B9BD5" fill-opacity="0.6"/>

          <!-- Left leg -->
          <rect x="100" y="182" width="56"  height="80" fill="#7B5EA7" fill-opacity="0.65"/>

          <!-- Right leg -->
          <rect x="164" y="182" width="56"  height="80" fill="#7B5EA7" fill-opacity="0.65"/>

          <!-- Grid lines (64×64 cells at 5px each) -->
          <defs>
            <pattern id="grid5" width="5" height="5" patternUnits="userSpaceOnUse">
              <path d="M 5 0 L 0 0 0 5" fill="none" stroke="rgba(100,100,100,0.25)" stroke-width="0.5"/>
            </pattern>
            <!-- Thicker grid every 8 cells (40px) for skin region boundaries -->
            <pattern id="grid40" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(80,80,80,0.4)" stroke-width="0.75"/>
            </pattern>
          </defs>

          <rect width="320" height="320" fill="url(#grid5)"/>
          <rect width="320" height="320" fill="url(#grid40)"/>

          <!-- Outer border -->
          <rect x="0.5" y="0.5" width="319" height="319" fill="none" stroke="#888" stroke-width="1"/>
        </svg>
      </div>
    </main>

    <!-- RIGHT PANEL -->
    <aside id="right-panel" aria-label="Preview and color panel">

      <!-- 3D Viewer -->
      <section id="viewer-3d" aria-label="3D character preview">
        <span class="viewer-label" aria-hidden="true">3D Preview</span>

        <div id="mc-figure" role="img" aria-label="Minecraft character placeholder">
          <div class="mc-head"></div>
          <div class="mc-body-row">
            <div class="mc-arm"></div>
            <div class="mc-torso"></div>
            <div class="mc-arm"></div>
          </div>
          <div class="mc-legs-row">
            <div class="mc-leg"></div>
            <div class="mc-leg"></div>
          </div>
        </div>
      </section>

      <!-- Color Panel -->
      <section id="color-panel" aria-label="Color picker and palette">

        <span class="panel-section-label">Color</span>

        <div class="color-row">
          <div class="current-swatch" role="button" tabindex="0" aria-label="Current color: coral #FF7F50"></div>
          <input class="hex-input" type="text" value="#FF7F50" aria-label="Hex color value" maxlength="7">
        </div>

        <span class="panel-section-label" style="font-size:8px;">Palette</span>

        <div class="palette-grid" role="group" aria-label="Color palette">
          <!-- Row 1: coral to lavender -->
          <div class="swatch active" style="background:#FF7F50" title="#FF7F50" role="button" tabindex="0" aria-label="Coral"></div>
          <div class="swatch" style="background:#FFB347" title="#FFB347" role="button" tabindex="0" aria-label="Orange"></div>
          <div class="swatch" style="background:#FFD166" title="#FFD166" role="button" tabindex="0" aria-label="Butter"></div>
          <div class="swatch" style="background:#9B8EC4" title="#9B8EC4" role="button" tabindex="0" aria-label="Lavender"></div>
          <div class="swatch" style="background:#B8A9D9" title="#B8A9D9" role="button" tabindex="0" aria-label="Light lavender"></div>
          <!-- Row 2: pinks -->
          <div class="swatch" style="background:#FF9999" title="#FF9999" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#FFB6C1" title="#FFB6C1" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#FFC0CB" title="#FFC0CB" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#C9A0DC" title="#C9A0DC" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#DDA0DD" title="#DDA0DD" role="button" tabindex="0"></div>
          <!-- Row 3: mint/teal/peach -->
          <div class="swatch" style="background:#98D8C8" title="#98D8C8" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#A8E6CF" title="#A8E6CF" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#B5EAD7" title="#B5EAD7" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#C7CEEA" title="#C7CEEA" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#FFDAC1" title="#FFDAC1" role="button" tabindex="0"></div>
          <!-- Row 4: darks to light -->
          <div class="swatch" style="background:#3D3340" title="#3D3340" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#7A7085" title="#7A7085" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#BFB8C8" title="#BFB8C8" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#E8DFF0" title="#E8DFF0" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#FFFFFF; border:1px solid #E8DFF0" title="#FFFFFF" role="button" tabindex="0"></div>
          <!-- Row 5: greys -->
          <div class="swatch" style="background:#000000" title="#000000" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#333333" title="#333333" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#666666" title="#666666" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#999999" title="#999999" role="button" tabindex="0"></div>
          <div class="swatch" style="background:#CCCCCC" title="#CCCCCC" role="button" tabindex="0"></div>
        </div>

      </section>
    </aside>

  </div><!-- /#main-area -->

  <!-- ========== BOTTOM BAR ========== -->
  <footer id="bottom-bar">

    <!-- Guide toggle -->
    <div class="guide-toggle" title="Toggle pixel guides">
      <div class="guide-track" role="switch" aria-checked="false" tabindex="0" aria-label="Guide lines">
        <div class="guide-knob"></div>
      </div>
      <span class="bottom-label">Guide</span>
    </div>

    <div class="bottom-divider" aria-hidden="true"></div>

    <!-- Skin type toggle -->
    <div class="pill-toggle" role="group" aria-label="Skin type">
      <button class="pill-btn active" type="button" aria-pressed="true">Normal</button>
      <button class="pill-btn" type="button" aria-pressed="false">Slim</button>
    </div>

    <div class="bottom-divider" aria-hidden="true"></div>

    <!-- Undo / Redo -->
    <div class="undo-redo">
      <button class="icon-btn" type="button" aria-label="Undo (Ctrl+Z)">↩ Undo</button>
      <button class="icon-btn" type="button" aria-label="Redo (Ctrl+Y)">↪ Redo</button>
    </div>

  </footer>

</body>
</html>
