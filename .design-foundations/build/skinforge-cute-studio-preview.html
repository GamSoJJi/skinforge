<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkinForge — Cute Studio Implementation Preview</title>

  <style>
    /* === DESIGN.md Phase 1 Tokens (light) === */
    :root {
      --background:               #EAE6FF;
      --surface:                  #FFFFFF;
      --surface-alt:              #DDD8F8;
      --surface-canvas:           #D8D8D8;
      --surface-viewer:           #2A2530;
      --accent-solid:             #C4407A;
      --accent-solid-hover:       #A82E65;
      --accent-tint:              #FFE8F2;
      --accent-on-solid:          #FFFFFF;
      --accent-secondary:         #9B8EC4;
      --accent-secondary-tint:    #EAE6FF;
      --accent-secondary-border:  #8C7EB5;
      --accent-tertiary:          #FFD166;
      --text:                     #2D2040;
      --text-secondary:           #5C5570;
      --text-on-accent:           #FFFFFF;
      --border:                   #D4CCEE;

      /* === Phase 2 Component Aliases === */
      --toolbar-btn-bg:           var(--surface);
      --toolbar-btn-bg-hover:     var(--surface-alt);
      --toolbar-btn-bg-active:    var(--accent-tint);
      --toolbar-btn-icon-color:   var(--text-secondary);
      --toolbar-btn-icon-hover:   var(--text);
      --toolbar-btn-icon-active:  var(--accent-solid);
      --toolbar-btn-radius:       var(--radius-md);

      --radius-sm:   6px;
      --radius-md:   8px;
      --radius-lg:   12px;
      --radius-full: 999px;

      /* fonts: Silkscreen = 'Courier New' monospace approx in CSP env */
      --font-display: 'Courier New', 'Lucida Console', monospace;
      --font-body:    system-ui, -apple-system, 'Segoe UI', sans-serif;

      --text-2xs: 10px;
      --text-xs:  11px;
      --text-sm:  12px;
      --text-base:14px;
      --text-lg:  16px;
      --text-xl:  20px;
      --text-2xl: 28px;
    }

    /* === RESET === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* === TOP BAR === */
    header#top-bar {
      height: 36px;
      min-height: 36px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 16px;
      flex-shrink: 0;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .logo-mark { color: var(--accent-solid); }
    .logo-mark svg { display: block; }

    .logo-title {
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--accent-solid);
      letter-spacing: 0.02em;
      line-height: 1;
    }

    nav#top-menu {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    nav#top-menu button {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      border: none;
      padding: 4px 8px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 150ms ease;
    }

    nav#top-menu button:hover {
      background: var(--surface-alt);
    }

    /* === OPTIONS BAR === */
    #options-bar {
      height: 32px;
      min-height: 32px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 14px;
    }

    .opts-label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .opts-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--surface);
      border-radius: var(--radius-full);
      padding: 2px;
      border: 1px solid var(--border);
    }

    .opts-btn {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: var(--radius-full);
      padding: 2px 9px;
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }

    .opts-btn.active {
      background: var(--surface-alt);
      color: var(--text);
      box-shadow: inset 0 0 0 1.5px var(--accent-secondary-border);
    }

    .opts-btn:hover:not(.active) {
      background: var(--surface-alt);
      color: var(--text);
    }

    .opts-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    /* === MAIN AREA === */
    #main-area {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }

    /* === LEFT TOOLBAR === */
    aside#toolbar {
      width: 44px;
      min-width: 44px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
      gap: 4px;
    }

    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1.5px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--toolbar-btn-icon-color);
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease,
                  transform 120ms ease-in;
      transform-origin: center center;
      overflow: visible;
    }

    .tool-btn:hover {
      background: var(--toolbar-btn-bg-hover);
      color: var(--toolbar-btn-icon-hover);
      transform: scale(1.05);
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease,
                  transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tool-btn.active {
      background: var(--toolbar-btn-bg-active);
      border-color: var(--accent-solid);
      color: var(--toolbar-btn-icon-active);
    }

    .tool-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .tool-separator {
      width: 24px;
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .tool-btn,
      .tool-btn:hover {
        transition: background 120ms ease, color 120ms ease;
        transform: none !important;
      }
    }

    /* === CENTER CANVAS === */
    #canvas-area {
      flex: 1;
      background-color: var(--surface-canvas);
      background-image:
        linear-gradient(45deg, #CACACA 25%, transparent 25%),
        linear-gradient(-45deg, #CACACA 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #CACACA 75%),
        linear-gradient(-45deg, transparent 75%, #CACACA 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #pixel-grid {
      display: block;
      image-rendering: pixelated;
      border-radius: var(--radius-sm);
      box-shadow: 0 0 0 1px #999, 0 4px 24px rgba(0,0,0,0.25);
    }

    /* === RIGHT PANEL === */
    aside#right-panel {
      width: 240px;
      min-width: 240px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(155, 142, 196, 0.18);
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #viewer-3d {
      height: 180px;
      min-height: 180px;
      flex-shrink: 0;
      background: var(--surface-viewer);
      border-radius: var(--radius-lg) 0 0 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* viewer-label: Phase 2 fix — was 9px Silkscreen, now 11px body sans */
    .viewer-label {
      position: absolute;
      top: 8px; left: 10px;
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--accent-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #mc-figure {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 10px;
    }

    .mc-head  { width:40px; height:40px; background:#F5CBA7; border-radius:2px; }
    .mc-body-row { display:flex; flex-direction:row; align-items:flex-start; }
    .mc-arm   { width:12px; height:36px; background:#5B9BD5; border-radius:2px; }
    .mc-torso { width:24px; height:40px; background:#5B9BD5; border-radius:2px; }
    .mc-legs-row { display:flex; flex-direction:row; gap:2px; }
    .mc-leg   { width:12px; height:36px; background:#7B5EA7; border-radius:2px; }

    #color-panel {
      flex: 1;
      padding: 12px;
      background: var(--background);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    /* panel-section-label: Phase 2 fix — was 9px Silkscreen, now 11px body sans semibold */
    .panel-section-label {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-swatch {
      width: 40px; height: 40px;
      min-width: 40px;
      border-radius: var(--radius-lg);
      background: var(--accent-solid);
      box-shadow: 0 0 0 2px white, 0 0 0 3.5px var(--accent-solid);
      cursor: pointer;
    }

    .hex-input {
      flex: 1;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      outline: none;
      transition: border-color 120ms;
    }

    .hex-input:focus {
      border-color: var(--accent-secondary-border);
      box-shadow: 0 0 0 2px rgba(140,126,181,0.18);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 20px);
      gap: 3px;
    }

    .swatch {
      width: 20px; height: 20px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .swatch:hover { transform: scale(1.2); z-index: 1; }
    .swatch.active { box-shadow: 0 0 0 2px white, 0 0 0 3.5px var(--accent-solid); }

    /* === BOTTOM BAR === */
    footer#bottom-bar {
      height: 30px;
      min-height: 30px;
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }

    .bottom-label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    .pill-toggle {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      padding: 2px;
      gap: 1px;
    }

    .pill-btn {
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 2px 9px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 120ms, color 120ms, box-shadow 120ms;
    }

    .pill-btn.active {
      background: var(--surface-alt);
      color: var(--text);
      box-shadow: inset 0 0 0 1.5px var(--accent-secondary-border);
    }

    .guide-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .guide-track {
      width: 28px; height: 14px;
      background: var(--surface);
      border: 1.5px solid var(--accent-secondary-border);
      border-radius: var(--radius-md);
      position: relative;
      cursor: pointer;
      transition: background 200ms;
    }

    .guide-track.on {
      background: var(--accent-secondary-border);
    }

    .guide-knob {
      position: absolute;
      top: 1px; left: 1px;
      width: 10px; height: 10px;
      background: var(--background);
      border-radius: 50%;
      transition: left 150ms;
    }

    .guide-track.on .guide-knob { left: 15px; }

    .bottom-divider {
      width: 1px; height: 16px;
      background: var(--border);
    }

    .icon-btn {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2px 8px;
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }

    .icon-btn:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    /* font note banner */
    .font-note {
      position: fixed;
      bottom: 36px;
      left: 44px;
      right: 240px;
      background: rgba(45,32,64,0.85);
      color: #FEFDF5;
      font-size: 11px;
      padding: 6px 12px;
      text-align: center;
      pointer-events: none;
      z-index: 99;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>

  <!-- ========== SVG ICON DEFS ========== -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <!-- Phase 2 icons: pen / eraser / fill / eyedropper / selection / wand -->
      <symbol id="i-pen" viewBox="0 0 18 18">
        <path d="M13,2 L16,5 L5.5,15.5 L2.5,12.5 Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
        <path d="M5.5,15.5 L3,16.5 L2.5,12.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        <line x1="11.8" y1="3.2" x2="14.8" y2="6.2" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/>
      </symbol>
      <symbol id="i-eraser" viewBox="0 0 18 18">
        <rect x="1.5" y="6.5" width="15" height="7" rx="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
        <line x1="7.5" y1="6.5" x2="7.5" y2="13.5" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
        <line x1="2" y1="16" x2="8" y2="16" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
      </symbol>
      <symbol id="i-fill" viewBox="0 0 18 18">
        <path d="M4.5,10 L4.5,16 L13.5,16 L13.5,10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
        <line x1="3.5" y1="10" x2="14.5" y2="10" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"/>
        <path d="M6.5,10 Q9,5.5 11.5,10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        <line x1="14" y1="6" x2="15.5" y2="3" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/>
        <circle cx="15.5" cy="2.2" r="1.5" fill="currentColor" stroke="none"/>
      </symbol>
      <symbol id="i-eyedropper" viewBox="0 0 18 18">
        <path d="M11,2 L16,7 L8,15 L3,10 Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
        <path d="M10.5,2.5 Q16.5,1.5 15.5,7.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
        <line x1="3" y1="10" x2="2" y2="13.5" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
        <circle cx="2" cy="14.5" r="1.5" fill="currentColor" stroke="none"/>
      </symbol>
      <symbol id="i-selection" viewBox="0 0 18 18">
        <rect x="1.5" y="1.5" width="15" height="15" rx="2"
          fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
          stroke-width="2.5" stroke-dasharray="4 3"/>
      </symbol>
      <symbol id="i-wand" viewBox="0 0 18 18">
        <line x1="16" y1="16" x2="10" y2="10" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"/>
        <line x1="5" y1="1.5" x2="5" y2="8.5" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
        <line x1="1.5" y1="5" x2="8.5" y2="5" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
        <line x1="2.9" y1="2.9" x2="7.1" y2="7.1" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
        <line x1="7.1" y1="2.9" x2="2.9" y2="7.1" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
      </symbol>
    </defs>
  </svg>

  <!-- ========== TOP BAR ========== -->
  <header id="top-bar">
    <div class="logo-group">
      <div class="logo-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 8 8" fill="none">
          <rect x="1" y="0" width="6" height="1" fill="currentColor"/>
          <rect x="0" y="1" width="1" height="2" fill="currentColor"/>
          <rect x="1" y="3" width="6" height="1" fill="currentColor"/>
          <rect x="6" y="4" width="1" height="2" fill="currentColor"/>
          <rect x="0" y="6" width="7" height="1" fill="currentColor"/>
        </svg>
      </div>
      <span class="logo-title">SkinForge</span>
    </div>
    <nav id="top-menu" aria-label="Application menu">
      <button type="button">File</button>
      <button type="button">Color</button>
    </nav>
  </header>

  <!-- ========== OPTIONS BAR ========== -->
  <div id="options-bar" role="toolbar" aria-label="Tool options">
    <span class="opts-label">Brush Size</span>
    <div class="opts-group" role="group" aria-label="Brush size">
      <button class="opts-btn active" type="button">1</button>
      <button class="opts-btn" type="button">2</button>
      <button class="opts-btn" type="button">4</button>
      <button class="opts-btn" type="button">8</button>
    </div>
    <div class="opts-divider" aria-hidden="true"></div>
    <span class="opts-label">Shape</span>
    <div class="opts-group" role="group" aria-label="Brush shape">
      <button class="opts-btn active" type="button">Square</button>
      <button class="opts-btn" type="button">Circle</button>
    </div>
  </div>

  <!-- ========== MAIN AREA ========== -->
  <div id="main-area">

    <!-- LEFT TOOLBAR -->
    <aside id="toolbar" aria-label="Drawing tools">

      <button class="tool-btn active" type="button" title="Pen (P)" aria-pressed="true">
        <svg width="18" height="18"><use href="#i-pen"/></svg>
      </button>

      <button class="tool-btn" type="button" title="Eraser (E)" aria-pressed="false">
        <svg width="18" height="18"><use href="#i-eraser"/></svg>
      </button>

      <div class="tool-separator" aria-hidden="true"></div>

      <button class="tool-btn" type="button" title="Fill Bucket (F)" aria-pressed="false">
        <svg width="18" height="18"><use href="#i-fill"/></svg>
      </button>

      <button class="tool-btn" type="button" title="Eyedropper (I)" aria-pressed="false">
        <svg width="18" height="18"><use href="#i-eyedropper"/></svg>
      </button>

      <div class="tool-separator" aria-hidden="true"></div>

      <button class="tool-btn" type="button" title="Rectangle Select (M)" aria-pressed="false">
        <svg width="18" height="18"><use href="#i-selection"/></svg>
      </button>

      <button class="tool-btn" type="button" title="Magic Wand (W)" aria-pressed="false">
        <svg width="18" height="18"><use href="#i-wand"/></svg>
      </button>

    </aside>

    <!-- CENTER CANVAS -->
    <main id="canvas-area" aria-label="Pixel editing canvas">
      <svg id="pixel-grid" width="320" height="320" viewBox="0 0 320 320"
           xmlns="http://www.w3.org/2000/svg" aria-label="64×64 skin canvas">
        <rect width="320" height="320" fill="#F5CBA7" fill-opacity="0.08"/>
        <rect x="120" y="8"   width="80"  height="64" fill="#F5CBA7" fill-opacity="0.75"/>
        <rect x="100" y="100" width="120" height="80" fill="#5B9BD5" fill-opacity="0.7"/>
        <rect x="58"  y="100" width="40"  height="72" fill="#5B9BD5" fill-opacity="0.6"/>
        <rect x="222" y="100" width="40"  height="72" fill="#5B9BD5" fill-opacity="0.6"/>
        <rect x="100" y="182" width="56"  height="80" fill="#7B5EA7" fill-opacity="0.65"/>
        <rect x="164" y="182" width="56"  height="80" fill="#7B5EA7" fill-opacity="0.65"/>
        <defs>
          <pattern id="grid5"  width="5"  height="5"  patternUnits="userSpaceOnUse">
            <path d="M 5 0 L 0 0 0 5" fill="none" stroke="rgba(100,100,100,0.25)" stroke-width="0.5"/>
          </pattern>
          <pattern id="grid40" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(80,80,80,0.4)" stroke-width="0.75"/>
          </pattern>
        </defs>
        <rect width="320" height="320" fill="url(#grid5)"/>
        <rect width="320" height="320" fill="url(#grid40)"/>
        <rect x="0.5" y="0.5" width="319" height="319" fill="none" stroke="#888" stroke-width="1"/>
      </svg>
    </main>

    <!-- RIGHT PANEL -->
    <aside id="right-panel" aria-label="Preview and color panel">

      <section id="viewer-3d" aria-label="3D character preview">
        <span class="viewer-label">3D Preview</span>
        <div id="mc-figure" role="img" aria-label="Minecraft character">
          <div class="mc-head"></div>
          <div class="mc-body-row">
            <div class="mc-arm"></div>
            <div class="mc-torso"></div>
            <div class="mc-arm"></div>
          </div>
          <div class="mc-legs-row">
            <div class="mc-leg"></div>
            <div class="mc-leg"></div>

    <div class="guide-toggle" title="Toggle guides">
