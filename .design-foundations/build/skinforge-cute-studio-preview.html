    /* === Monochrome Purple Token Set === */
    :root {
      --background:               #EAE6FF;  /* pale lavender */
      --surface:                  #FFFFFF;
      --surface-alt:              #DDD8F8;  /* hover / active panel bg */
      --surface-canvas:           #D8D8D8;
      --surface-viewer:           #2A2530;

      /* ONE purple hue, shade steps only */
      --accent-solid:             #7250C0;  /* vibrant deep purple — 5.80:1 on white */
      --accent-solid-hover:       #5D3FA8;  /* darker — 7.66:1 on white */
      --accent-tint:              #C8BCFF;  /* saturated light purple for active bg */
      --accent-on-solid:          #FFFFFF;

      --accent-secondary:         #9B8EC4;  /* mid lavender — secondary signal */
      --accent-secondary-tint:    #EAE6FF;
      --accent-secondary-border:  #8C7EB5;

      --text:                     #2D2040;
      --text-secondary:           #5C5570;
      --text-on-accent:           #FFFFFF;
      --border:                   #D4CCEE;

      /* === Phase 2 Component Aliases === */
      --toolbar-btn-bg:           var(--surface);
      --toolbar-btn-bg-hover:     var(--surface-alt);
      --toolbar-btn-bg-active:    var(--accent-tint);
      --toolbar-btn-icon-color:   var(--text-secondary);
      --toolbar-btn-icon-hover:   var(--text);
      --toolbar-btn-icon-active:  var(--accent-solid);
      --toolbar-btn-radius:       var(--radius-md);

      --radius-sm:   6px;
      --radius-md:   8px;
      --radius-lg:   12px;
      --radius-full: 999px;

      --font-display: 'KenPixel', 'Courier New', monospace;
      --font-body:    system-ui, -apple-system, 'Segoe UI', sans-serif;

      --text-2xs: 10px;
      --text-xs:  11px;
      --text-sm:  12px;
      --text-base:14px;
      --text-lg:  16px;
      --text-xl:  20px;
      --text-2xl: 28px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* === TOP BAR === */
    header#top-bar {
      height: 36px;
      min-height: 36px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 16px;
      flex-shrink: 0;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .logo-mark { color: var(--accent-solid); }
    .logo-mark svg { display: block; }

    .logo-title {
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--accent-solid);
      letter-spacing: 0.04em;
      line-height: 1;
    }

    nav#top-menu {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    nav#top-menu button {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      border: none;
      padding: 4px 8px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 150ms ease;
    }

    nav#top-menu button:hover { background: var(--surface-alt); }

    /* === OPTIONS BAR === */
    #options-bar {
      height: 32px;
      min-height: 32px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 14px;
    }

    .opts-label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .opts-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--surface);
      border-radius: var(--radius-full);
      padding: 2px;
      border: 1px solid var(--border);
    }

    .opts-btn {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: var(--radius-full);
      padding: 2px 9px;
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }

    .opts-btn.active {
      background: var(--accent-tint);
      color: var(--accent-solid);
      box-shadow: inset 0 0 0 1.5px var(--accent-solid);
    }

    .opts-btn:hover:not(.active) {
      background: var(--surface-alt);
      color: var(--text);
    }

    .opts-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    /* === MAIN AREA === */
    #main-area {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }

    /* === LEFT TOOLBAR === */
    aside#toolbar {
      width: 44px;
      min-width: 44px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
      gap: 4px;
    }

    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1.5px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--toolbar-btn-icon-color);
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease,
                  transform 120ms ease-in;
      transform-origin: center center;
      overflow: visible;
    }

    .tool-btn:hover {
      background: var(--toolbar-btn-bg-hover);
      color: var(--toolbar-btn-icon-hover);
      transform: scale(1.05);
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease,
                  transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tool-btn.active {
      background: var(--toolbar-btn-bg-active);
      border-color: var(--accent-solid);
      color: var(--toolbar-btn-icon-active);
    }

    .tool-btn svg { width: 18px; height: 18px; display: block; }

    .tool-separator {
      width: 24px;
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .tool-btn, .tool-btn:hover {
        transition: background 120ms ease, color 120ms ease;
        transform: none !important;
      }
    }

    /* === CENTER CANVAS === */
    #canvas-area {
      flex: 1;
      background-color: var(--surface-canvas);
      background-image:
        linear-gradient(45deg, #CACACA 25%, transparent 25%),
        linear-gradient(-45deg, #CACACA 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #CACACA 75%),
        linear-gradient(-45deg, transparent 75%, #CACACA 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #pixel-grid {
      display: block;
      image-rendering: pixelated;
      border-radius: var(--radius-sm);
      box-shadow: 0 0 0 1px #999, 0 4px 24px rgba(0,0,0,0.25);
    }

    /* === RIGHT PANEL === */
    aside#right-panel {
      width: 240px;
      min-width: 240px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(114,80,192,0.12);
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #viewer-3d {
      height: 180px;
      min-height: 180px;
      flex-shrink: 0;
      background: var(--surface-viewer);
      border-radius: var(--radius-lg) 0 0 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .viewer-label {
      position: absolute;
      top: 8px; left: 10px;
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--accent-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #mc-figure {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 10px;
    }

    .mc-head  { width:40px; height:40px; background:#F5CBA7; border-radius:2px; }
    .mc-body-row { display:flex; flex-direction:row; align-items:flex-start; }
    .mc-arm   { width:12px; height:36px; background:#7250C0; border-radius:2px; }
    .mc-torso { width:24px; height:40px; background:#9B8EC4; border-radius:2px; }
    .mc-legs-row { display:flex; flex-direction:row; gap:2px; }
    .mc-leg   { width:12px; height:36px; background:#5D3FA8; border-radius:2px; }

    #color-panel {
      flex: 1;
      padding: 12px;
      background: var(--background);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .panel-section-label {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-swatch {
      width: 40px; height: 40px;
      min-width: 40px;
      border-radius: var(--radius-lg);
      background: var(--accent-solid);
      box-shadow: 0 0 0 2px white, 0 0 0 3.5px var(--accent-solid);
      cursor: pointer;
    }

    .hex-input {
      flex: 1;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      outline: none;
      transition: border-color 120ms;
    }

    .hex-input:focus {
      border-color: var(--accent-solid);
      box-shadow: 0 0 0 2px rgba(114,80,192,0.18);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 20px);
      gap: 3px;
    }

    .swatch {
      width: 20px; height: 20px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .swatch:hover { transform: scale(1.2); z-index: 1; }
    .swatch.active { box-shadow: 0 0 0 2px white, 0 0 0 3.5px var(--accent-solid); }

    /* === BOTTOM BAR === */
    footer#bottom-bar {
      height: 30px;
      min-height: 30px;
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }

    .bottom-label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    .pill-toggle {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      padding: 2px;
      gap: 1px;
    }

    .pill-btn {
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 2px 9px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 120ms, color 120ms, box-shadow 120ms;
    }

    .pill-btn.active {
      background: var(--accent-tint);
      color: var(--accent-solid);
      box-shadow: inset 0 0 0 1.5px var(--accent-solid);
    }

    .guide-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .guide-track {
      width: 28px; height: 14px;
      background: var(--surface);
      border: 1.5px solid var(--accent-secondary-border);
      border-radius: var(--radius-md);
      position: relative;
      cursor: pointer;
      transition: background 200ms;
    }

    .guide-track.on { background: var(--accent-secondary-border); }

    .guide-knob {
      position: absolute;
      top: 1px; left: 1px;
      width: 10px; height: 10px;
      background: var(--background);
      border-radius: 50%;
      transition: left 150ms;
    }

    .guide-track.on .guide-knob { left: 15px; }

    .bottom-divider {
      width: 1px; height: 16px;
      background: var(--border);
    }

    .icon-btn {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2px 8px;
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }

    .icon-btn:hover {
      background: var(--accent-tint);
      color: var(--accent-solid);
    }
  </style>
</head>
<body>

  <!-- BOTTOM BAR -->
  <footer id="bottom-bar">
    <div class="guide-toggle" title="Toggle guides">
      <div class="guide-track" role="switch" aria-checked="false" tabindex="0" aria-label="Guide lines">
        <div class="guide-knob"></div>
      </div>
      <span class="bottom-label">Guide</span>
    </div>
    <div class="bottom-divider" aria-hidden="true"></div>
    <div class="pill-toggle" role="group" aria-label="Skin type">
      <button class="pill-btn active" type="button" aria-pressed="true">Normal</button>
      <button class="pill-btn" type="button" aria-pressed="false">Slim</button>
    </div>
    <div class="bottom-divider" aria-hidden="true"></div>
    <div style="display:flex;gap:4px;">
      <button class="icon-btn" type="button" aria-label="Undo">↩ Undo</button>
      <button class="icon-btn" type="button" aria-label="Redo">↪ Redo</button>
    </div>
  </footer>
